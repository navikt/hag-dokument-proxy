name: Build and deploy
on:
  push:
    branches:
      - main
      - 'dev/**'
env:
  NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
jobs:
  build_and_deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.0"
          registry-url: "https://npm.pkg.github.com"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Install dependencies
        run: pnpm install --frozen-lockfile  --ignore-scripts --prod
      - name: Build and push image and SBOM to OCI registry
        if: steps.changed-files.outputs.changed != 'only-inputs'
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1
        id: docker-build-push
        with:
          team: helsearbeidsgiver
      - name: Deploy to Nais
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/dev.yml
          VAR: image=${{ steps.docker-build-push.outputs.image }}
